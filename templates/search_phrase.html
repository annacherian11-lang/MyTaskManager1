{% extends "base.html" %}
{% block title %}Phrase Search{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card bg-blur border-0 rounded-4 p-4">
        <h2 class="text-white mb-3">Search via Phrase Matching</h2>
        <p class="text-soft mb-4">
          Enter keywords to search across JIRA and Confluence. All words must be present in results.
        </p>
        
        <form method="post" action="{{ url_for('search_phrase_submit') }}">
          <div class="mb-3">
            <label class="form-label text-soft">Enter search keywords:</label>
            <input type="text" name="query" class="form-control bg-white text-dark" 
                   placeholder="e.g., front loading washing machine" 
                   required autofocus>
          </div>
          <div class="mb-3">
            <small class="text-soft">
              <strong>Tip:</strong> Use specific keywords. All words must match in the results.
            </small>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-light fw-semibold">
              Search
            </button>
            <a href="{{ url_for('search_insights') }}" class="btn btn-outline-light">Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
